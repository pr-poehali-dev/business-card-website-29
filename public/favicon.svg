<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Фон -->
  <rect width="64" height="64" rx="12" fill="#0f1422"/>
  <!-- Кузов катка -->
  <rect x="8" y="18" width="40" height="16" rx="4" fill="#f0c030"/>
  <!-- Кабина -->
  <rect x="31" y="11" width="15" height="12" rx="3" fill="#d4a017"/>
  <!-- Стекло кабины -->
  <rect x="34" y="13" width="9" height="7" rx="2" fill="#22d3ee" opacity="0.95"/>
  <!-- Выхлопная труба -->
  <rect x="11" y="9" width="3.5" height="11" rx="1.75" fill="#b8960c"/>
  <ellipse cx="12.75" cy="8.5" rx="3" ry="2" fill="#22d3ee" opacity="0.6"/>
  <!-- Большой передний барабан -->
  <circle cx="18" cy="42" r="11" fill="#141928" stroke="#f0c030" stroke-width="2.5"/>
  <circle cx="18" cy="42" r="6" fill="none" stroke="#f0c030" stroke-width="1" opacity="0.3"/>
  <circle cx="18" cy="42" r="2.5" fill="#f0c030"/>
  <!-- Задний барабан -->
  <circle cx="44" cy="42" r="7.5" fill="#141928" stroke="#f0c030" stroke-width="2"/>
  <circle cx="44" cy="42" r="3.5" fill="none" stroke="#f0c030" stroke-width="1" opacity="0.3"/>
  <circle cx="44" cy="42" r="2" fill="#f0c030" opacity="0.7"/>
  <!-- Дорога -->
  <rect x="3" y="53" width="58" height="4" rx="2" fill="#22d3ee" opacity="0.35"/>
  <!-- Разметка -->
  <rect x="20" y="54.5" width="6" height="1" rx="0.5" fill="#fff" opacity="0.5"/>
  <rect x="30" y="54.5" width="6" height="1" rx="0.5" fill="#fff" opacity="0.5"/>
  <rect x="40" y="54.5" width="6" height="1" rx="0.5" fill="#fff" opacity="0.5"/>
</svg>
