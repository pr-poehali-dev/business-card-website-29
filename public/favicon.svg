<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Щит-форма фон -->
  <path d="M100,6 L182,40 L182,118 Q182,166 100,194 Q18,166 18,118 L18,40 Z"
    fill="#0f1422" stroke="#f0c030" stroke-width="3.5"/>

  <!-- Фото катка вписано в щит через clipPath -->
  <defs>
    <clipPath id="shieldClip">
      <path d="M100,6 L182,40 L182,118 Q182,166 100,194 Q18,166 18,118 L18,40 Z"/>
    </clipPath>
  </defs>

  <image
    href="https://cdn.poehali.dev/projects/767a3a56-afb6-4f9c-bffc-569465bff7eb/bucket/c86c5623-6496-4556-91b1-3ddf8e92b89a.jpg"
    x="10" y="10" width="180" height="175"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#shieldClip)"/>

  <!-- Затемнение снизу для читаемости текста -->
  <path d="M100,6 L182,40 L182,118 Q182,166 100,194 Q18,166 18,118 L18,40 Z"
    fill="url(#fadeBottom)"/>
  <defs>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="50%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(10,14,24,0.85)"/>
    </linearGradient>
  </defs>

  <!-- Обводка щита поверх -->
  <path d="M100,6 L182,40 L182,118 Q182,166 100,194 Q18,166 18,118 L18,40 Z"
    fill="none" stroke="#f0c030" stroke-width="3.5"/>

  <!-- Надпись ФАВОРИТ -->
  <text x="100" y="182"
    font-family="Arial Black, Impact, sans-serif"
    font-size="17"
    font-weight="900"
    fill="#f0c030"
    text-anchor="middle"
    letter-spacing="3"
    dominant-baseline="middle">ФАВОРИТ</text>
</svg>
